bio: |-
  Amos Olalekan Abolaji is Professor of Biochemistry in the Molecular Drug Metabolism and Toxicology Unit, Department of Biochemistry, College of Medicine, University of Ibadan, and Deputy Provost (Administration) of the University's Postgraduate College (2024–2026). He earned his B.Sc. in Biochemistry from Obafemi Awolowo University, Ile-Ife (1998), his M.Sc. from the University of Lagos (2003) and his Ph.D. from the University of Calabar (2010).

  His research sits at the interface of molecular toxicology, oxidative stress biology and disease modelling. Working with Drosophila melanogaster and rodent models, he has led and co-led projects that uncover the redox and molecular mechanisms through which environmental contaminants cause harm, and that test how phytochemicals such as resveratrol, curcumin, hesperidin and kolaviron can protect against them. In recent years the group's focus has widened from neurodegeneration to the mechanisms of cancer initiation, progression and therapeutic response.

  In 2014, after postdoctoral training at the Federal University of Santa Maria, Brazil, he established the first Drosophila laboratory in the Department of Biochemistry at the University of Ibadan (DROSLABUI). The laboratory collaborates with scientists in the United Kingdom, the United States, Germany, Spain and Brazil, and has trained staff and students from 21 Nigerian institutions in the use of Drosophila for experimental medicine.

  Since 2019 he has been a Visiting Lecturer on the M.Sc. in International Health and Tropical Medicine at the Nuffield Department of Medicine, University of Oxford, following a 2018 Africa-Oxford Visiting Fellowship in the Department of Biochemistry. He also serves, without salary, as Team Lead of the Drosophila Research and Training Centre (DRTC), a non-profit institute that advances the fruit fly as a low-cost, genetically tractable model for biomedical research and training across sub-Saharan Africa.

  He has supervised more than 140 undergraduate, master's and doctoral students and currently supervises or co-supervises six Ph.D. candidates.
