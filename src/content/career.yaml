teaching: |-
  He teaches biochemistry to students of B.Sc. Biochemistry, MBBS/BDS, Physiotherapy, Pharmacy, Microbiology, Human Nutrition and Nursing, covering carbohydrate, protein, lipid and nucleic acid biochemistry, comparative biochemistry, the biochemistry and immunology of parasitic diseases, and biochemical toxicology. He has supervised 85 undergraduate projects and many M.Sc. and Ph.D. students across Biochemistry, Pharmaceutical Chemistry, Pharmacognosy and Physiology, and lectures on environmental toxins for the University of Oxford M.Sc. in International Health and Tropical Medicine.
