title: The fruit fly as a model for toxicology
order: 1
summary: Establishing Drosophila melanogaster as a low-cost, genetically tractable model for toxicology and biomedical research in Africa, from survival and climbing assays to redox biochemistry, gene expression and transcriptomics.
agents:
  - Survival and lifespan
  - Negative geotaxis (climbing)
  - Redox biomarkers
  - RNA sequencing
