title: Reproductive and endocrine toxicology
order: 4
summary: Investigating chemicals and drugs that damage the ovary, uterus and testis, including the industrial ovotoxicant 4-vinylcyclohexene and its metabolites and the safety of artemisinin-based antimalarials in pregnancy.
agents:
  - 4-Vinylcyclohexene
  - VCD
  - Artemisia annua
  - Artemether-lumefantrine
  - Anti-tuberculosis drugs
