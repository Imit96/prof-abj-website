title: 'Cancer: carcinogens and personalised fly avatars'
order: 3
summary: Defining how chemical carcinogens disrupt redox balance and gene expression, and, with the University of Glasgow, building Drosophila avatars that carry the tumour mutations of individual African colorectal cancer patients to screen drugs in vivo.
agents:
  - 7,12-Dimethylbenz[a]anthracene
  - N-Methyl-N-nitrosourea
  - Benzo[a]pyrene
  - Acrylamide
  - Colorectal cancer avatars
