title: Neurodegeneration and Parkinson's disease
order: 2
summary: Modelling Parkinson's disease with neurotoxins and genetic lines such as parkin and α-synuclein flies, and testing dietary phytochemicals that protect dopaminergic neurons through antioxidant and mitochondrial actions.
agents:
  - Rotenone
  - MPTP
  - Parkin loss of function
  - α-Synuclein
  - Resveratrol
  - Hesperidin
  - Kaempferol
  - Trans-astaxanthin
  - Naringenin
